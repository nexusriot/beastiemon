# newsyslog(8) rotation for BeastieMon's daemon log.
# Installed to /usr/local/etc/newsyslog.conf.d/beastied.conf.
#
# Rotation signals the PID in the pidfile with SIGHUP (signal 1). That PID is
# the daemon(8) supervisor, which reopens its -o output file on SIGHUP
# (FreeBSD 11+), so beastied keeps logging to the fresh file after a rotate.
# (If daemon(8) also forwards the signal to beastied, it just triggers a
# harmless config reload.)
#
# logfilename           [owner:group]   mode count size  when  flags  [/pidfile]                [sig]
/var/log/beastied.log    root:_beastie   640   7     1000  *     J      /var/run/beastied.pid     1
