# beastiemon.conf — BeastieMon daemon configuration
# Install: /usr/local/etc/beastiemon.conf  (mode 0640, owner root:_beastie)

[server]
# Address and port for the web UI and API.
# To expose on the LAN, change to "0.0.0.0:8088" or put nginx in front.
# An absolute path (e.g. "/var/run/beastied/beastied.sock") binds a
# Unix-domain socket instead of TCP — local-only access with no port to
# firewall. Put it under /var/run/beastied: the daemon binds *after* dropping
# to _beastie, which cannot create a socket in root-owned /var/run itself, and
# the rc.d script creates that directory with the right owner on start.
listen = "127.0.0.1:8088"

[collect]
# How often to sample metrics. Must be a valid Go duration (e.g. "1s", "500ms").
interval = "1s"

# How many seconds of 1-second-resolution history to keep in memory.
# 3600 = one full hour.  Each snapshot is ~2 KB, so 3600 ≈ 7 MB.
ring_size = 3600

# Filesystems to include in the FS usage panel.
# Comment out to include everything.
fs_include = ["/", "/var", "/usr", "/tmp"]

# Network interfaces to exclude (loopback is rarely interesting).
net_exclude = ["lo0"]

# How many processes to show in the "Top Processes" panel, ranked by CPU%.
# The kernel "idle" process is always excluded — it is pinned near 100% per
# core by definition and would permanently occupy the top slot.
top_procs = 5

# FreeBSD-only extras, off by default: each shells out (zpool / jls / ps /
# pfctl) every tick, so enable only where the host actually uses them.
#zfs   = true
#jails = true
#pf    = true

# With zfs = true, also report the N largest datasets (`zfs list`). 0, the
# default, collects none: a host with jails can have hundreds of datasets and
# every one would ride every snapshot.
#zfs_datasets = 10

# Count these processes every tick so an alert rule can fire when one stops.
# The "Top Processes" list is only the top-N by CPU, so an idle service never
# appears there and its absence is indistinguishable from it being quiet.
# Empty (the default) costs nothing; a non-empty list makes the collector look
# up a name for every process rather than only the ones it reports.
#proc_watch = ["sshd", "nginx", "postgres"]

[auth]
# Optional HTTP authentication. Disabled by default (all fields empty),
# preserving the "bind to localhost, front with nginx" model.
#
# Basic auth makes the browser dashboard prompt for credentials natively;
# set both username and password to enable it:
#   username = "admin"
#   password = "change-me"
#
# A bearer token is meant for API/CLI clients (curl, scripts). Send it as
# "Authorization: Bearer <token>" or, for the SSE endpoint where headers
# can't be set, as a ?token=<token> query parameter (note: query tokens
# may appear in proxy logs):
#   token = "long-random-string"
#
# /healthz is always reachable without credentials so liveness probes work.

[store]
# Optional on-disk history (SQLite), parallel to the in-memory ring, so
# /api/series can answer ranges longer than ring_size and history survives
# restarts. Disabled while path is empty.
#
# The directory must be writable by the daemon user (_beastie) — create it:
#   mkdir -p /var/db/beastiemon && chown _beastie:_beastie /var/db/beastiemon
#path       = "/var/db/beastiemon/history.db"
#retention  = "720h"   # prune samples older than this (default 30 days)
#resolution = "1m"     # roll each window up to one avg+min/max row (default 1m)
#
# Tiered downsampling: rows older than coarse_after get re-aggregated into
# one row per coarse_resolution (min/max envelopes merge exactly), keeping
# long retention cheap. Set coarse_after = "0s" to keep fine resolution
# for the whole retention window.
#coarse_after      = "168h"  # default 7 days
#coarse_resolution = "1h"    # default 1 hour

[alerts]
# Optional threshold alerts. Each [[alerts.rule]] watches one metric field;
# when it stays beyond the threshold for at least `for`, a JSON webhook POST
# fires (and again, with "state":"resolved", on recovery). `webhook` here is
# the default endpoint; a rule may override it. Rule states and recent events
# are also served at /api/alerts and shown on the dashboard's Alerts card;
# with [store] enabled, events persist across restarts.
#webhook = "https://hooks.example.com/beastiemon"
#
# Sampler watchdog: fire a synthetic "watchdog" alert (to the webhook above)
# when no sample has been collected for this long — catches a wedged sampler,
# which threshold rules can't see. Resolves on the next sample. Default off.
#stale_after = "30s"
#
# `format` shapes the webhook body: "raw" (default) posts the alert JSON;
# "slack" and "discord" post the message shape those services' incoming
# webhooks expect, so a rule can target a Slack/Discord webhook URL directly
# with no translating proxy. Set once here, or per rule.
#format  = "slack"
#
# Array metrics (fs, temp, jail, proc) use `field` as a selector: an exact
# name/mount, or "max" (default) for the worst-case value. zfs reduces to the
# worst case across pools, since "is any pool unhealthy" is the real question.
#
# Metrics and their fields:
#   cpu   total user sys idle
#   mem   used_pct used free          swap  pct used
#   load  load1 load5 load15
#   fs    <mount> | max                temp  <sensor> | max
#   disk  read_bps write_bps read_iops write_iops total_bps total_iops
#   net   rx_bps tx_bps rx_pps tx_pps total_bps rx_err tx_err err
#         rx_drop tx_drop drop
#   zfs   used_pct health scan_pct scan_age_hours   (worst case across pools)
#   arc   hit_rate size target
#   jail  count | <jail name>          pf    state_pct states drop_rate
#                                            match_rate search_rate insert_rate
#   proc  <name from proc_watch>
#
# zfs `health` is graded numerically so the ordinary comparator can alert on
# it: 0 ONLINE, 1 DEGRADED, 2 anything worse (FAULTED/UNAVAIL/REMOVED/OFFLINE).
#
#[[alerts.rule]]
#name       = "cpu-sustained"
#metric     = "cpu"      # cpu|mem|swap|load|fs|temp|disk|net
#field      = "total"    # metric-specific: total, used_pct, load1, max, ...
#op         = ">"        # > | >= | < | <= | ==
#threshold  = 90
#for        = "30s"      # sustain duration before firing (default 0 = immediate)
#repeat     = "5m"       # re-notify every 5m while firing (default 0 = notify once)
#hysteresis = 5          # only resolve once it falls to <=85, damping flapping (default 0)
#
#[[alerts.rule]]
#name      = "root-fs-full"
#metric    = "fs"
#field     = "/"
#op        = ">="
#threshold = 90
#for       = "1m"
#webhook   = "https://hooks.slack.com/services/T000/B000/XXXX"
#format    = "slack"
#
# A pool leaving ONLINE. Arguably the most important rule on a ZFS host:
# without it a degraded pool is visible on the dashboard but pages nobody.
#[[alerts.rule]]
#name      = "pool-unhealthy"
#metric    = "zfs"
#field     = "health"
#op        = ">="
#threshold = 1
#
# Scrub overdue. 35 days covers a monthly schedule with slack. Pools that have
# never been scrubbed report no age at all and show as "unknown" rather than
# firing — the dashboard flags those separately.
#[[alerts.rule]]
#name      = "scrub-overdue"
#metric    = "zfs"
#field     = "scan_age_hours"
#op        = ">"
#threshold = 840
#
# Service down. Needs "sshd" in [collect] proc_watch above; `beastied -t`
# warns if it is missing, because the rule would sit at "unknown" forever.
#[[alerts.rule]]
#name      = "sshd-down"
#metric    = "proc"
#field     = "sshd"
#op        = "<"
#threshold = 1
#for       = "30s"
#
# pf state table filling up — connections start being dropped with nothing in
# the logs to explain it.
#[[alerts.rule]]
#name      = "pf-states-high"
#metric    = "pf"
#field     = "state_pct"
#op        = ">"
#threshold = 80
#
# NIC errors. Flat at zero on healthy hardware, so any sustained rate is real.
#[[alerts.rule]]
#name      = "nic-errors"
#metric    = "net"
#field     = "err"
#op        = ">"
#threshold = 0
#for       = "1m"
